name: Deploy Infrastructure with Ansible

on:
  push:
    branches: [ "ansible" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Run ansible deployment
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y ansible sshpass

      - name: Create vault password file
        run: echo "${{ secrets.VAULT_PASS }}" > vault_pass.txt

      - name: Run base playbook (system setup)
        working-directory: infrastructure-automation
        run: |
          ansible-playbook -i inventory.ini playbooks/base.yml --vault-password-file vault_pass.txt
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_FORCE_COLOR: "True"

      - name: Run docker setup
        working-directory: infrastructure-automation
        run: |
          ansible-playbook -i inventory.ini playbooks/docker.yml --vault-password-file vault_pass.txt
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_FORCE_COLOR: "True"

      - name: Run database setup
        working-directory: infrastructure-automation
        run: |
          ansible-playbook -i inventory.ini playbooks/db.yml --vault-password-file vault_pass.txt
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_FORCE_COLOR: "True"

      - name: Run CMS setup
        working-directory: infrastructure-automation
        run: |
          ansible-playbook -i inventory.ini playbooks/cms.yml --vault-password-file vault_pass.txt
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_FORCE_COLOR: "True"