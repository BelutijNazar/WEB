name: Deploy Infrastructure to Production

on:
  push:
    branches: [ "ansible" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Combat Server
    runs-on: self-hosted
    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_FORCE_COLOR: "True"
      # Указываем путь к папке с плейбуками, если она в корне репозитория - оставь точку
      WORK_DIR: infrastructure-automation 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Подготовка окружения на Github Runner (Debian)
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          # Устанавливаем ansible, sshpass и git (если нет)
          sudo apt-get install -y ansible sshpass git python3-pip

      # 2. Создание файлов с секретами (SSH ключ и Vault пароль)
      - name: Setup Secrets and SSH
        run: |
          # ВАЖНО: Создаем файл пароля СРАЗУ ВНУТРИ рабочей папки
          echo "${{ secrets.VAULT_PASS }}" > ${{ env.WORK_DIR }}/vault_pass.txt
          
          # Создаем приватный ключ для SSH
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
      # 3. Генерация динамического инвентаря
      - name: Generate Inventory
        run: |
          # ИЗМЕНЕНИЕ: Создаем инвентарь ВНУТРИ папки проекта (рядом с group_vars)
          echo "[prod]" > ${{ env.WORK_DIR }}/inventory.ini
          echo "${{ secrets.DEPLOY_HOST }} ansible_user=${{ secrets.DEPLOY_USER }} ansible_ssh_private_key_file=~/.ssh/id_rsa" >> ${{ env.WORK_DIR }}/inventory.ini

      # 4. Проверка синтаксиса
      - name: Ansible Syntax Check
        working-directory: ${{ env.WORK_DIR }}
        run: |
          echo "Checking syntax..."
          # Теперь inventory.ini и vault_pass.txt лежат рядом, убираем ../
          ansible-playbook -i inventory.ini playbooks/base.yml --syntax-check --vault-password-file vault_pass.txt
          ansible-playbook -i inventory.ini playbooks/docker.yml --syntax-check --vault-password-file vault_pass.txt
          ansible-playbook -i inventory.ini playbooks/db.yml --syntax-check --vault-password-file vault_pass.txt
          ansible-playbook -i inventory.ini playbooks/cms.yml --syntax-check --vault-password-file vault_pass.txt

      # 5. (Task list пропускаю, там аналогично убери ../)

      # 6. Боевое развертывание
      
      - name: Deploy Base System
        working-directory: ${{ env.WORK_DIR }}
        run: |
          ansible-playbook -i inventory.ini playbooks/base.yml --vault-password-file vault_pass.txt

      - name: Deploy Docker & Compose
        working-directory: ${{ env.WORK_DIR }}
        run: |
          ansible-playbook -i inventory.ini playbooks/docker.yml --vault-password-file vault_pass.txt

      - name: Deploy Database
        working-directory: ${{ env.WORK_DIR }}
        run: |
          ansible-playbook -i inventory.ini playbooks/db.yml --vault-password-file vault_pass.txt

      - name: Deploy CMS
        working-directory: ${{ env.WORK_DIR }}
        run: |
          ansible-playbook -i inventory.ini playbooks/cms.yml --vault-password-file vault_pass.txt

      # 7. Очистка
      - name: Cleanup secrets
        if: always()
        run: |
          # Чистим файлы внутри папки
          rm -f ${{ env.WORK_DIR }}/vault_pass.txt ${{ env.WORK_DIR }}/inventory.ini ~/.ssh/id_rsa